# Dockerized build/run for RotS (the game is built 32-bit inside it). See docs/BUILD.md.
#
#   docker compose build                       # build the Ubuntu 22.04 toolchain image
#   docker compose run --rm --service-ports rots   # interactive shell in the repo
#
# The repo is bind-mounted at /rots, so build artifacts (bin/ageland, *.o) and any
# source edits are shared with the host. The game listens on port 1024.
services:
  rots:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    image: rots-dev:jammy-amd64
    container_name: rots
    # Use the default docker0 bridge: `compose run --rm` never removes a project
    # network, so without this every worktree leaked a `<dir>_default` network
    # and exhausted Docker's address pool.
    network_mode: bridge
    # Run as the host user (set by scripts/rots-docker.sh) instead of the container
    # default (root), so build artifacts and any runtime-created directories
    # (bin/ageland, *.o, lib/accounts/*, lib/account_characters/*, etc.) land on the
    # bind-mounted host filesystem owned by you, not root.
    user: "${ROTS_UID:-1000}:${ROTS_GID:-1000}"
    working_dir: /rots
    volumes:
      - .:/rots
    ports:
      - "1024:1024"
    stdin_open: true
    tty: true
    command: bash
