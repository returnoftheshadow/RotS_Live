name: CI

on:
  push:
    branches:
      - master
      - release-frodo
      - release-frodo-next
  pull_request:
    branches:
      - master
      - release-frodo
      - release-frodo-next

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, Unit Tests, and Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        # ageland links -lcrypt as a 32-bit binary, so the i386 crypt development package is
        # required alongside the 64-bit one (README, "build prerequisites").
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format \
            cmake \
            cargo \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libcrypt-dev \
            libcrypt-dev:i386 \
            make \
            pkg-config \
            python3 \
            rustc

      - name: Configure build tree
        run: make configure

      - name: Run C++ unit tests
        run: make test

      - name: Run account smoke flow
        # lib/world is git-ignored, so a plain checkout has no world for the smoke server to boot.
        # The step is skipped then; run `make smoke-account` by hand where a world is installed.
        if: hashFiles('lib/world/**') != ''
        run: make smoke-account

  image-build-test:
    name: Build and Unit Tests (Ubuntu 22.04 image)
    # The repository's Dockerfile is the game server's Linux and compiler, so this job builds
    # and tests the game in the same environment as the server and the local Docker workflow.
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Load or build the development image
        # From the Actions cache or the repository's pre-release when one matches the Dockerfile,
        # so an Ubuntu snapshot outage stops only a pull request that changes the Dockerfile.
        uses: ./.github/actions/dev-image

      - name: Configure build tree
        # Running as the runner's user keeps the build tree writable by later steps.
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/rots" --workdir /rots
          rots-dev:ci make configure

      - name: Run C++ unit tests
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" --volume "$PWD:/rots" --workdir /rots
          rots-dev:ci make test
