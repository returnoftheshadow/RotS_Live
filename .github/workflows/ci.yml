name: CI

on:
  push:
    branches:
      - main
      - master
      - scripting-engine
    paths-ignore:
      - BuilderClient
      - BuilderClient/**
  pull_request:
    branches:
      - main
      - master
      - scripting-engine
    paths-ignore:
      - BuilderClient
      - BuilderClient/**

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, Unit Tests, and Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format \
            cmake \
            cargo \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libcrypt-dev \
            libcrypt-dev:i386 \
            libgtest-dev \
            make \
            pkg-config \
            python3 \
            rustc

      - name: Configure build tree
        run: make configure

      - name: Build C++ server
        run: make build

      - name: Run C++ unit tests
        run: make test

      - name: Check account smoke world data
        id: smoke-world
        run: |
          if [ -f lib/world/scr/index ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping account smoke flow because lib/world/scr/index is not present. Runtime world files are git-ignored and required for server boot."
          fi

      - name: Run account smoke flow
        if: steps.smoke-world.outputs.available == 'true'
        run: make smoke-account
