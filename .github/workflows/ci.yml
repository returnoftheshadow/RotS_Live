name: CI

on:
  push:
    branches:
      - main
      - master
      - scripting-engine
    paths-ignore:
      - BuilderClient
      - BuilderClient/**
  pull_request:
    branches:
      - main
      - master
      - scripting-engine
    paths-ignore:
      - BuilderClient
      - BuilderClient/**

permissions:
  contents: read

jobs:
  build-test-smoke:
    name: Build, Unit Tests, and Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out smoke world files
        uses: actions/checkout@v4
        with:
          repository: Noobinabox/rots-world
          ref: main
          path: .ci/rots-world
          persist-credentials: false

      - name: Install smoke world files
        run: |
          mkdir -p lib/world
          cp -a .ci/rots-world/lib/world/. lib/world/

      - name: Normalize empty smoke script catalog
        run: |
          if [ ! -f lib/world/scr/index ]; then
            echo "::notice::Skipping smoke script catalog normalization because lib/world/scr/index is not present."
            exit 0
          fi

          filtered_index="$(mktemp)"
          while IFS= read -r script_entry; do
            if [ "$script_entry" = "$" ]; then
              break
            fi
            script_path="lib/world/scr/$script_entry"
            if [ ! -f "$script_path" ]; then
              echo "::error::Smoke script index references missing file $script_entry."
              exit 1
            fi
            if awk '/^#[0-9]/ && ! /^#99999([[:space:]].*)?$/ { found=1 } END { exit found ? 0 : 1 }' "$script_path"; then
              printf '%s\n' "$script_entry" >> "$filtered_index"
            else
              echo "::notice::Removed empty smoke script placeholder $script_entry from lib/world/scr/index."
            fi
          done < lib/world/scr/index

          if [ -s "$filtered_index" ]; then
            printf '$\n' >> "$filtered_index"
            mv "$filtered_index" lib/world/scr/index
          else
            cat > lib/world/scr/ci-empty.scr <<'EOF'
          #0 CI empty script catalog placeholder~
          ~
          999 0 0 0 0 0 0 0
          #99999
          EOF
            printf 'ci-empty.scr\n$\n' > lib/world/scr/index
            echo "::notice::Installed inert script catalog because the smoke world repo has only empty legacy script placeholders."
          fi

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-format \
            cmake \
            cargo \
            gcc-multilib \
            g++-multilib \
            libc6-dev-i386 \
            libcrypt-dev \
            libcrypt-dev:i386 \
            libgtest-dev \
            make \
            pkg-config \
            python3 \
            rustc

      - name: Configure build tree
        run: make configure

      - name: Build C++ server
        run: make build

      - name: Run C++ unit tests
        run: make test

      - name: Check account smoke world data
        id: smoke-world
        run: |
          if [ -f lib/world/scr/index ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping account smoke flow because lib/world/scr/index is not present. Runtime world files are git-ignored and required for server boot."
          fi

      - name: Run account smoke flow
        if: steps.smoke-world.outputs.available == 'true'
        run: make smoke-account
